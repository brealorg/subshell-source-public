# 3g: a full release build in one daemon (KSP, Kotlin, D8 merge, lint vital,
# then packaging with humongous dex byte arrays) peaked at 2030M of a 2048M
# heap with G1 evacuation failure; beta.5's first packageRelease failed there
# (see HANDOVER-HISTORY 3.4). The Kotlin daemon is pinned so it does not
# inherit the larger heap.
# 4g: both lanes share one Kotlin daemon (same JVM args), and two
# concurrent compilations in 2g failed with "Not enough memory to run
# compilation" twice on 2026-09-26. The machine has 16 GB RAM.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g
org.gradle.configuration-cache=true
org.gradle.parallel=true
android.nonTransitiveRClass=true
